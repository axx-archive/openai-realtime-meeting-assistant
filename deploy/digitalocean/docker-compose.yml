services:
  meetingassist:
    image: ${BONFIRE_MEETINGASSIST_IMAGE:-meetingassist:local}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        BONFIRE_RELEASE_COMMIT: ${BONFIRE_RELEASE_COMMIT:-unqualified}
        BONFIRE_GIT_TREE_DIGEST: ${BONFIRE_GIT_TREE_DIGEST:-unqualified}
        BONFIRE_BUILD_CONFIG_SHA256: ${BONFIRE_BUILD_CONFIG_SHA256:-unqualified}
        BONFIRE_BUILD_TRANSITIVE_INPUTS_SHA256: ${BONFIRE_BUILD_TRANSITIVE_INPUTS_SHA256:-unqualified}
        BONFIRE_SOURCE_ARCHIVE_SHA256: ${BONFIRE_SOURCE_ARCHIVE_SHA256:-unqualified}
        BONFIRE_BUILD_INPUT_MANIFEST_SHA256: ${BONFIRE_BUILD_INPUT_MANIFEST_SHA256:-unqualified}
    # .env carries runtime secrets into the app container. Current
    # provider-backed product work is OpenAI-only and its model/reasoning map is
    # server-owned; stale Anthropic/runner dials are ignored or fail closed.
    # Do not move secrets into an `environment:` block here.
    env_file:
      - ${BONFIRE_BASE_ENV_FILE:-.env}
    environment:
      BONFIRE_CODEX_QUEUE_PATH: /app/codex-queue/jobs
      BONFIRE_CODEX_HEARTBEAT_PATH: /app/codex-queue/heartbeat.json
      # The render profile uses a purpose-specific queue volume. It never
      # receives the company-brain meeting_data volume.
      BONFIRE_RENDER_QUEUE_PATH: /app/render-queue/jobs
      BONFIRE_RENDER_HEARTBEAT_PATH: /app/render-queue/heartbeat.json
      # The release tool emits these into a separate runtime env file. Explicit
      # interpolation makes that file authoritative over any stale release
      # values in the long-lived secret-bearing .env.
      BONFIRE_RELEASE_IDENTITY_REQUIRED: ${BONFIRE_RELEASE_IDENTITY_REQUIRED:-false}
      BONFIRE_RELEASE_COMMIT: ${BONFIRE_RELEASE_COMMIT:-}
      BONFIRE_GIT_TREE_DIGEST: ${BONFIRE_GIT_TREE_DIGEST:-}
      BONFIRE_SOURCE_ARCHIVE_SHA256: ${BONFIRE_SOURCE_ARCHIVE_SHA256:-}
      BONFIRE_BUILD_TRANSITIVE_INPUTS_SHA256: ${BONFIRE_BUILD_TRANSITIVE_INPUTS_SHA256:-}
      BONFIRE_BUILD_CONFIG_SHA256: ${BONFIRE_BUILD_CONFIG_SHA256:-}
      BONFIRE_BUILD_INPUT_MANIFEST_SHA256: ${BONFIRE_BUILD_INPUT_MANIFEST_SHA256:-}
      BONFIRE_BUILD_MANIFEST_SHA256: ${BONFIRE_BUILD_MANIFEST_SHA256:-}
      BONFIRE_BINARY_SHA256: ${BONFIRE_BINARY_SHA256:-}
      BONFIRE_IMAGE_DIGEST: ${BONFIRE_IMAGE_DIGEST:-}
      BONFIRE_RELEASE_ENVIRONMENT_MARKER: ${BONFIRE_RELEASE_ENVIRONMENT_MARKER:-}
      BONFIRE_RELEASE_BUNDLE_SHA256: ${BONFIRE_RELEASE_BUNDLE_SHA256:-}
      BONFIRE_BUILD_VERSION: ${BONFIRE_BUILD_VERSION:-}
      STRIDE_E10_W4_MODE: ${STRIDE_E10_W4_RELEASE_MODE:?STRIDE_E10_W4_RELEASE_MODE is required}
      STRIDE_E10_W4_SNAPSHOT_PATH: ${STRIDE_E10_W4_SNAPSHOT_PATH:?STRIDE_E10_W4_SNAPSHOT_PATH is required}
      STRIDE_E10_W4_ACTIVATION_BACKUP_DIR: ${STRIDE_E10_W4_ACTIVATION_BACKUP_DIR:?STRIDE_E10_W4_ACTIVATION_BACKUP_DIR is required}
      STRIDE_E10_W4_ACTIVATION_RECEIPT_PATH: ${STRIDE_E10_W4_ACTIVATION_RECEIPT_PATH:?STRIDE_E10_W4_ACTIVATION_RECEIPT_PATH is required}
    volumes:
      - meeting_data:/app/data
      # Cost/eval books stay in a dedicated volume and remain part of normal
      # backups without widening access to the company-brain volume.
      - usage_ledger:/app/data/usage
      - codex_queue:/app/codex-queue
      - render_queue:/app/render-queue
    ports:
      - "40000-40100:40000-40100/udp"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Required-mode starts may apply migrations and prove canonical parity
      # before binding HTTP. Shadow-mode parity is deferred behind the serving
      # gate, but retain the bounded window for required-mode recovery rather
      # than declaring that healthy process terminally unhealthy mid-proof.
      start_period: 300s
    # Live meeting intelligence can briefly exceed 1 GiB while a digest/model
    # pass overlaps active WebRTC media, even though the Go heap returns below
    # 400 MiB afterward. A 1 GiB cgroup limit OOM-kills the entire room process
    # and disconnects every participant, so retain headroom for that bounded
    # transient working set.
    mem_limit: 3072m
    # Rides both networks: the egress-less render_internal leg exists ONLY so
    # the render sidecar can POST its callback here.
    networks:
      - default
      - render_internal
    depends_on:
      canonical-postgres:
        condition: service_healthy
    restart: unless-stopped

  # W1 canonical shadow target. It is deliberately private to the Compose
  # network and resource-capped for the W1 droplet. W4 may replace
  # this with managed HA PostgreSQL after its separate cost/DR gate.
  canonical-postgres:
    image: ${BONFIRE_POSTGRES_IMAGE:-postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193}
    environment:
      POSTGRES_DB: bonfire
      POSTGRES_USER: bonfire
      POSTGRES_PASSWORD: ${BONFIRE_CANONICAL_POSTGRES_PASSWORD:?BONFIRE_CANONICAL_POSTGRES_PASSWORD is required}
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
    volumes:
      - canonical_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bonfire -d bonfire"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    mem_limit: 256m
    shm_size: 64m
    restart: unless-stopped

  # One-shot ownership initializer for the dedicated render queue. It receives
  # no env, secrets, networks, or company data, and exits before HTML runs.
  render-queue-init:
    profiles: ["render"]
    image: ${BONFIRE_RENDER_IMAGE:-meetingassist-render:local}
    build:
      context: ../..
      dockerfile: Dockerfile.render
      args:
        BONFIRE_RELEASE_COMMIT: ${BONFIRE_RELEASE_COMMIT:-unqualified}
        BONFIRE_GIT_TREE_DIGEST: ${BONFIRE_GIT_TREE_DIGEST:-unqualified}
        BONFIRE_BUILD_CONFIG_SHA256: ${BONFIRE_BUILD_CONFIG_SHA256:-unqualified}
        BONFIRE_BUILD_TRANSITIVE_INPUTS_SHA256: ${BONFIRE_BUILD_TRANSITIVE_INPUTS_SHA256:-unqualified}
        BONFIRE_SOURCE_ARCHIVE_SHA256: ${BONFIRE_SOURCE_ARCHIVE_SHA256:-unqualified}
        BONFIRE_BUILD_INPUT_MANIFEST_SHA256: ${BONFIRE_BUILD_INPUT_MANIFEST_SHA256:-unqualified}
    user: "0:0"
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - mkdir -p /app/render-queue/jobs && chown 0:0 /app/render-queue /app/render-queue/jobs && chmod 2770 /app/render-queue /app/render-queue/jobs && chown 65532:65532 /app/render-queue /app/render-queue/jobs && find /app/render-queue/jobs -xdev -maxdepth 1 -type f -name '*.json' -exec chown 0:0 {} + -exec chmod 0660 {} + -exec chown 65532:65532 {} +
    volumes:
      - render_queue:/app/render-queue
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    read_only: true
    restart: "no"

  render-runner:
    profiles: ["render"]
    image: ${BONFIRE_RENDER_IMAGE:-meetingassist-render:local}
    build:
      context: ../..
      dockerfile: Dockerfile.render
      args:
        BONFIRE_RELEASE_COMMIT: ${BONFIRE_RELEASE_COMMIT:-unqualified}
        BONFIRE_GIT_TREE_DIGEST: ${BONFIRE_GIT_TREE_DIGEST:-unqualified}
        BONFIRE_BUILD_CONFIG_SHA256: ${BONFIRE_BUILD_CONFIG_SHA256:-unqualified}
        BONFIRE_BUILD_TRANSITIVE_INPUTS_SHA256: ${BONFIRE_BUILD_TRANSITIVE_INPUTS_SHA256:-unqualified}
        BONFIRE_SOURCE_ARCHIVE_SHA256: ${BONFIRE_SOURCE_ARCHIVE_SHA256:-unqualified}
        BONFIRE_BUILD_INPUT_MANIFEST_SHA256: ${BONFIRE_BUILD_INPUT_MANIFEST_SHA256:-unqualified}
    # Explicit callback-only allowlist. In particular, the renderer receives
    # no OpenAI/Anthropic, database, mail, calendar, storage, or TURN secrets.
    environment:
      BONFIRE_RUNNER_TOKEN: ${BONFIRE_RUNNER_TOKEN:?BONFIRE_RUNNER_TOKEN is required}
      BONFIRE_RENDER_QUEUE_PATH: /app/render-queue/jobs
      BONFIRE_RENDER_HEARTBEAT_PATH: /app/render-queue/heartbeat.json
      BONFIRE_RENDER_CALLBACK_URL: http://meetingassist:3000/internal/render/jobs/result
      BONFIRE_RENDER_TIMEOUT: ${BONFIRE_RENDER_TIMEOUT:-3m}
      BONFIRE_RENDER_MAX_HTML_BYTES: ${BONFIRE_RENDER_MAX_HTML_BYTES:-33554432}
      BONFIRE_RENDER_MAX_PDF_BYTES: ${BONFIRE_RENDER_MAX_PDF_BYTES:-67108864}
    volumes:
      - render_queue:/app/render-queue
    # The Chrome OS sandbox remains enabled under a dedicated non-root user.
    # Ubuntu 24.04 requires the release-bound AppArmor userns rule, while the
    # Docker-default-derived seccomp profile adds only the five exact syscalls
    # observed for the pinned Chrome 150 namespace sandbox. Activation proves
    # both profiles and never falls back to an unconfined or no-sandbox mode.
    cap_drop:
      - ALL
    security_opt:
      - apparmor=bonfire-render-runner-v1
      - no-new-privileges:true
      - seccomp=/etc/docker/seccomp/bonfire-render-runner-v1.json
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m
    shm_size: 256m
    pids_limit: 256
    mem_limit: 1024m
    # Defense in depth: the renderer can reach only the callback service and
    # has no route to the Internet, coturn, databases, or host metadata.
    networks:
      - render_internal
    depends_on:
      meetingassist:
        condition: service_healthy
      render-queue-init:
        condition: service_completed_successfully
    restart: unless-stopped

  coturn:
    image: ${BONFIRE_COTURN_IMAGE:-coturn/coturn@sha256:71c3c990283385567f11794ee692e3a47b66fd9b0bb39e42afbe776e331dd888}
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${MEETING_TURN_SECRET:?MEETING_TURN_SECRET is required}
      - --realm=${MEETING_TURN_REALM:-thebonfire.xyz}
      - --external-ip=${PION_NAT1TO1_IP:-146.190.171.224}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-multicast-peers
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    restart: unless-stopped

  caddy:
    image: ${BONFIRE_CADDY_IMAGE:-caddy@sha256:25cdc846626b62d05f6b633b9b40c2c9f6ef89b515dc76133cefd920f7dbe562}
    depends_on:
      - meetingassist
    env_file:
      - ${BONFIRE_BASE_ENV_FILE:-.env}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

networks:
  # internal: true blocks all egress beyond the network itself — the render
  # sidecar's whole world is the app container's callback route.
  render_internal:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  # Explicit external names protect migrated operational history from an
  # accidental `docker compose down -v` and make the cutover invariant clear.
  codex_queue:
    external: true
    name: digitalocean_codex_queue
  # Purpose-specific queue/results handoff. Never substitute meeting_data:
  # render jobs contain attacker/agent-authored HTML.
  render_queue:
  meeting_data:
  usage_ledger:
    external: true
    name: digitalocean_usage_ledger
  canonical_postgres:
    external: true
    name: digitalocean_canonical_postgres
